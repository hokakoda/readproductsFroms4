apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: product-master-data-agent
  description: AI agent enabling Sales Representatives to ask natural language questions about product master data from SAP S/4HANA and receive instant, accurate answers.
  version: "1.0.0"

provides:
  apis:
    - name: product-master-data-agent
      kind: a2a
      ordId: customer.build:apiResource:product-master-data-657cb.product-master-data-agent:v1

requires:
  - name: sap-s4-api-product-srv-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:product-master-data-657cb.sap-s4-api-product-srv-mcp-server:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
